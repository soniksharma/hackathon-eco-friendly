<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMind AI | Sustainable Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fff4;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(47, 133, 90, 0.1);
        }
        .tab-active {
            background-color: #2f855a;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-lg w-full space-y-8">
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="flex justify-center items-center gap-2 text-forest-green">
                <span class="text-4xl">🌿</span>
                <h1 class="text-3xl font-bold text-green-800 tracking-tight">EcoMind AI</h1>
            </div>
            <p class="text-green-600 font-light italic">Your minimalist sustainable living copilot</p>
        </div>

        <!-- Main Interface -->
        <div class="glass-card rounded-3xl p-6 shadow-xl space-y-6">
            <!-- Tabs -->
            <div class="flex p-1 bg-green-100 rounded-2xl">
                <button onclick="setMode('swap', this)" class="tab-btn flex-1 py-2 text-sm font-medium rounded-xl transition-all duration-200 tab-active">Green Swap</button>
                <button onclick="setMode('waste', this)" class="tab-btn flex-1 py-2 text-sm font-medium rounded-xl transition-all duration-200 text-green-700 hover:bg-green-200">Waste Wizard</button>
                <button onclick="setMode('challenge', this)" class="tab-btn flex-1 py-2 text-sm font-medium rounded-xl transition-all duration-200 text-green-700 hover:bg-green-200">Eco-Challenge</button>
            </div>

            <!-- Input Section -->
            <div class="space-y-4">
                <div class="relative">
                    <input id="userInput" type="text"
                           placeholder="What do you want to swap?"
                           class="w-full px-4 py-3 rounded-2xl border border-green-200 focus:ring-2 focus:ring-green-500 focus:outline-none transition-all bg-white/50 placeholder-green-400">
                </div>
                <button onclick="askAI()"
                        id="actionBtn"
                        class="w-full py-3 bg-green-700 hover:bg-green-800 text-white font-semibold rounded-2xl shadow-lg transform active:scale-95 transition-all duration-200">
                    Greenify it!
                </button>
            </div>

            <!-- Result Section -->
            <div id="resultBox" class="hidden space-y-2 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="flex items-center gap-2 text-xs font-semibold text-green-500 uppercase tracking-wider">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    EcoMind Suggestion
                </div>
                <div id="resultText" class="p-4 bg-green-50 rounded-2xl text-green-800 leading-relaxed border border-green-100">
                    <!-- AI response goes here -->
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loader" class="hidden flex justify-center py-4">
                <div class="w-6 h-6 border-2 border-green-700 border-t-transparent rounded-full animate-spin"></div>
            </div>
        </div>

        <div class="text-center text-xs text-green-400">
            Powered by Gemma 4B Local LLM
        </div>
    </div>

    <script>
        let currentMode = 'swap';

        function setMode(mode, btn) {
            currentMode = mode;

            // Update tabs
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('tab-active', 'text-white');
                b.classList.add('text-green-700', 'hover:bg-green-200');
            });
            btn.classList.add('tab-active');
            btn.classList.remove('text-green-700', 'hover:bg-green-200');

            // Update input placeholder
            const input = document.getElementById('userInput');
            const btnText = document.getElementById('actionBtn');

            if(mode === 'swap') {
                input.placeholder = "What do you want to swap?";
                input.style.display = "block";
                btnText.innerText = "Greenify it!";
            } else if(mode === 'waste') {
                input.placeholder = "What are you throwing away?";
                input.style.display = "block";
                btnText.innerText = "Sort Waste!";
            } else {
                input.style.display = "none";
                btnText.innerText = "Get Daily Challenge!";
            }
        }

        async function askAI() {
            const input = document.getElementById('userInput').value;
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');
            const loader = document.getElementById('loader');
            const actionBtn = document.getElementById('actionBtn');

            if (currentMode !== 'challenge' && !input) return;

            // UI State
            resultBox.classList.add('hidden');
            loader.classList.remove('hidden');
            actionBtn.disabled = true;
            actionBtn.classList.add('opacity-50');

            try {
                const response = await fetch('http://localhost:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: input, mode: currentMode })
                });

                if (!response.ok) throw new Error('Backend server error');

                const data = await response.json();
                resultText.innerText = data.response;
                resultBox.classList.remove('hidden');
            } catch (error) {
                resultText.innerText = "Oops! Make sure the EcoMind backend is running. Error: " + error.message;
                resultBox.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                actionBtn.disabled = false;
                actionBtn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
